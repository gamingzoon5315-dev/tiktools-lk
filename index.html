<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTools LK — Video Tools</title>
<meta name="description" content="Free video tools for creators.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
.wrap{max-width:760px;margin:auto;padding:28px 18px}
.card{background:#17171f;border:1px solid #292936;border-radius:20px;padding:28px;box-shadow:0 12px 40px #0005}
h1{font-size:34px;margin:0 0 8px}p{color:#bdbdc8;line-height:1.6}
input{width:100%;padding:16px;border-radius:12px;border:1px solid #3a3a47;background:#0e0e14;color:#fff;font-size:16px;margin:12px 0}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700;cursor:pointer}
.note{font-size:13px;margin-top:16px;color:#8f8f9b}
.ad{margin:20px 0;padding:22px;text-align:center;border:1px dashed #444;border-radius:14px;color:#777}
footer{color:#777;font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎬 TikTools LK</h1>
    <p>Simple video tools for creators.</p>
    <input id="url" placeholder="Paste your video link here">
    <button onclick="start()">Continue</button>
    <p id="msg" class="note"></p>
  </div>
  <div class="ad">Ad space — add an ad network after your site gets approved.</div>
  <footer>Use this service only for videos you own or have permission to download.</footer>
</div>
<script>
function start(){
  const u=document.getElementById('url').value.trim();
  const m=document.getElementById('msg');
  if(!u){m.textContent='Please paste a video link.';return;}
  m.textContent='Link received. The download service will be connected in the next step.';
}
</script>
</body>
</html>
